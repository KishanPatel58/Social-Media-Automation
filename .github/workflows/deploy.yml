name: Deploy Split Branches

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Push Client
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          mkdir client-temp
          cp -r client/* client-temp/

          git checkout --orphan client-deploy

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -r client-temp/* .

          rm -rf client-temp

          git add .
          git commit -m "Deploy Client"

          git push origin client-deploy --force

  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Push Server
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          mkdir server-temp
          cp -r server/* server-temp/

          git checkout --orphan server-deploy

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -r server-temp/* .

          rm -rf server-temp

          git add .
          git commit -m "Deploy Server"

          git push origin server-deploy --force